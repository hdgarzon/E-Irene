name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta Postgres + Auth + Storage locales (Docker) con el schema y
      # las políticas RLS del proyecto — la misma base que se usa en dev.
      - name: Levantar Supabase local
        run: supabase start

      # Las credenciales locales son deterministas (config.toml del repo);
      # no son secretos, solo funcionan contra el contenedor efímero de este job.
      - name: Configurar variables de entorno
        run: |
          STATUS=$(supabase status -o env)
          API_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d'"' -f2)
          PUBLISHABLE_KEY=$(echo "$STATUS" | grep '^PUBLISHABLE_KEY=' | cut -d'"' -f2)
          SECRET_KEY=$(echo "$STATUS" | grep '^SECRET_KEY=' | cut -d'"' -f2)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
          } >> "$GITHUB_ENV"

      # Sin OPENAI_API_KEY/DEEPGRAM_API_KEY: los proveedores mock se activan
      # solos (misma lógica que en dev/prod) — sin costo, determinista.
      - name: Tests unitarios (incluye aislamiento RLS multi-tenant)
        run: npm test

      - name: Build de producción
        run: npm run build

      # Los binarios (~150 MB) se cachean entre corridas. Sin esto, cada corrida
      # los baja de nuevo y el paso depende de la velocidad de los mirrors: el
      # 19-ago-2026 pasó de tardar 20s a colgarse 17 min, agotando el timeout
      # del job y bloqueando el despliegue con el código en perfecto estado.
      - name: Cachear navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegadores de Playwright
        timeout-minutes: 8
        run: |
          # `--with-deps` dispara apt-get, y ahí es donde esto se cuelga: el
          # 19-ago-2026 el mirror azure.archive.ubuntu.com dejó de responder
          # (todo Ign:), apt cayó al mirror público y se quedó 7½ min sin
          # avanzar, agotando el timeout y bloqueando el despliegue.
          #
          # Las librerías de sistema que Chromium necesita ya vienen en la
          # imagen de los runners de GitHub, así que apt es un lujo, no un
          # requisito: se intenta con un tope corto y, si el mirror está
          # caído, se sigue igual. Si de verdad faltara una librería, los
          # tests E2E fallarían con un error claro en vez de colgarse acá.
          timeout 180 npx playwright install-deps chromium \
            || echo "::warning::install-deps falló o expiró (mirror de apt); se continúa sin él"
          # Los binarios sí se cachean (ver paso anterior): esto es instantáneo
          # cuando hay acierto.
          npx playwright install chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ===========================================================================
  # Despliegue a producción en dos fases:
  #   migrar → desplegar SIN alias → verificar → recién entonces promover.
  #
  # Los dos intentos fallidos del 19-ago-2026, para que no se repitan:
  #
  #  1. Vercel desplegaba solo al mergear y las migraciones se aplicaban a
  #     mano. Un merge con migración (0039) dejó el código nuevo corriendo
  #     contra el esquema viejo y tumbó la consulta en vivo.
  #
  #  2. Este job construía acá con `vercel build --prod` y subía el resultado
  #     con `--prebuilt`. TODAS las variables del proyecto están marcadas
  #     Sensitive en Vercel, así que `vercel pull` trae los nombres pero no los
  #     valores. NEXT_PUBLIC_SUPABASE_URL se hornea en el bundle en tiempo de
  #     build, quedó vacía, y la app respondió 500 en todas las rutas
  #     ("Invalid supabaseUrl"). Producción se recuperó promoviendo el
  #     despliegue anterior.
  #
  # De ahí las dos reglas de este diseño:
  #
  #   · NO se construye acá. `vercel deploy` SIN `--prebuilt` sube el código y
  #     deja que Vercel lo construya con sus propias variables, incluidas las
  #     Sensitive — igual que hacía la integración Git. No agregar `vercel
  #     build` ni `--prebuilt` sin resolver antes lo de las Sensitive.
  #
  #   · Se despliega con `--skip-domain` (sin tocar el alias), se verifica, y
  #     solo si responde se promueve. Producción nunca se reemplaza por algo
  #     que no se haya comprobado. El intento anterior verificaba DESPUÉS de
  #     reemplazarla, que es como no verificar.
  # ===========================================================================
  deploy:
    # Nunca desplegar algo que no pasó la suite (incluye rls/retention, que
    # cubren obligaciones legales).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cancelar a mitad de un `db push` o de un promote es justo lo que no se
    # quiere: los despliegues se encolan, no se interrumpen.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Fase 1: esquema ──────────────────────────────────────────────────
      # Va primero. Si falla, el job se detiene y el código nuevo nunca llega:
      # producción sigue en la versión anterior, coherente con su esquema.
      #
      # El caso inverso (migración aplicada + deploy fallido) deja esquema
      # nuevo con código viejo. Es tolerable porque las migraciones de este
      # repo son aditivas. Una destructiva (drop/rename de algo en uso) rompe
      # esa premisa: hay que partirla en dos despliegues.
      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migraciones a producción
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          # Sin --include-all: solo lo posterior a la última migración remota.
          # Una migración aplicada fuera de orden se arregla con
          # `supabase migration repair`, no aflojando este comando.
          supabase db push --yes

      # ── Fase 2: construir y desplegar, SIN tocar producción ──────────────
      - name: Instalar Vercel CLI
        # Versión fija: `vercel@latest` puede cambiar de comportamiento sin aviso.
        run: npm install -g vercel@59

      - name: Desplegar sin alias (construye Vercel)
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prod --skip-domain --yes \
                  --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado (sin promover): $url"

      # ── Fase 3: verificar ANTES de promover ──────────────────────────────
      # `|| echo 000` a propósito: sin eso, un curl que falle aborta el paso
      # por `set -e` y no se llega a imprimir el diagnóstico. Pasó en el
      # intento anterior: el paso moría con "exit code 23" sin decir nada útil.
      - name: Verificar el despliegue nuevo
        run: |
          fallo=0
          # -L es obligatorio: /terminos responde 307 hacia /login cuando no hay
          # sesión, que es lo correcto. Sin seguir la redirección, una ruta sana
          # se lee como fallo y se bloquea un despliegue bueno.
          for ruta in / /login /terminos /privacidad /seguridad; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L \
                     --retry 5 --retry-delay 10 --retry-all-errors \
                     --max-time 30 "${{ steps.deploy.outputs.url }}$ruta" || echo "000")
            echo "HTTP $code  $ruta"
            [ "$code" = "200" ] || fallo=1
          done
          if [ "$fallo" = "1" ]; then
            echo "::error::El despliegue nuevo no responde 200. NO se promueve; producción queda intacta."
            exit 1
          fi

      # ── Fase 4: recién ahora, producción ─────────────────────────────────
      # Cambio de alias instantáneo, sin reconstruir: el artefacto es el mismo
      # que se acaba de verificar.
      - name: Promover a producción
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel promote "${{ steps.deploy.outputs.url }}" --yes \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verificar producción tras promover
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -L \
                   --retry 5 --retry-delay 10 --retry-all-errors \
                   --max-time 30 "https://e-irene.co" || echo "000")
          echo "HTTP $code  https://e-irene.co"
          if [ "$code" != "200" ]; then
            echo "::error::Producción no responde 200 tras promover. Revertir con: vercel promote <despliegue-anterior> --scope henry-garzons-projects"
            exit 1
          fi
