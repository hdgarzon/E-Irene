name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta Postgres + Auth + Storage locales (Docker) con el schema y
      # las políticas RLS del proyecto — la misma base que se usa en dev.
      - name: Levantar Supabase local
        run: supabase start

      # Las credenciales locales son deterministas (config.toml del repo);
      # no son secretos, solo funcionan contra el contenedor efímero de este job.
      - name: Configurar variables de entorno
        run: |
          STATUS=$(supabase status -o env)
          API_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d'"' -f2)
          PUBLISHABLE_KEY=$(echo "$STATUS" | grep '^PUBLISHABLE_KEY=' | cut -d'"' -f2)
          SECRET_KEY=$(echo "$STATUS" | grep '^SECRET_KEY=' | cut -d'"' -f2)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
          } >> "$GITHUB_ENV"

      # Sin OPENAI_API_KEY/DEEPGRAM_API_KEY: los proveedores mock se activan
      # solos (misma lógica que en dev/prod) — sin costo, determinista.
      - name: Tests unitarios (incluye aislamiento RLS multi-tenant)
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ===========================================================================
  # DESACTIVADO — no re-habilitar sin arreglar antes lo de abajo.
  #
  # Este job existe para aplicar las migraciones ANTES de desplegar, y esa
  # parte funciona: en su única corrida real (19-ago-2026) `supabase db push`
  # se ejecutó correctamente contra producción.
  #
  # Lo que NO funciona es el build. `vercel build --prod` desde CI produjo un
  # artefacto roto: el deploy se completó y la app respondió HTTP 500 en todas
  # las rutas. Hubo que recuperar producción con
  # `vercel promote <deploy-anterior> --scope henry-garzons-projects`.
  #
  # Causa probable, SIN CONFIRMAR: `vercel pull` no descarga las variables de
  # entorno marcadas como "Sensitive", así que el build de CI se hace sin
  # ellas. Falta ver los build logs del deployment que falló para confirmarlo.
  #
  # Además el job tiene un defecto de diseño propio: el smoke check corre
  # DESPUÉS de que el deploy ya reemplazó producción, así que detecta la rotura
  # tarde. Al rehacerlo hay que desplegar sin alias (`--skip-domain`), verificar
  # y recién entonces promover — el patrón de dos fases que la documentación de
  # Vercel recomienda justamente para deploys con migraciones.
  #
  # Mientras tanto vuelve a desplegar Vercel por su cuenta al mergear a main
  # (se revirtió git.deploymentEnabled en vercel.json). Eso reintroduce el
  # problema original: si un PR trae una migración, hay que aplicarla A MANO
  # antes de mergear, o el código nuevo correrá contra el esquema viejo:
  #
  #     supabase db push --dry-run --linked   # ver qué falta
  #     supabase db push --linked
  # ===========================================================================
  deploy:
    # Nunca desplegar algo que no pasó la suite (incluye rls/retention, que
    # cubren obligaciones legales).
    needs: test
    # Apagado a propósito: ver el bloque de arriba. Para re-habilitarlo,
    # restaurar la condición original:
    #   github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dos despliegues simultáneos podrían intercalar migraciones y builds de
    # commits distintos. cancel-in-progress queda en false a propósito: cancelar
    # a mitad de un `db push` es justo lo que no se quiere.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Fase 1: esquema ──────────────────────────────────────────────────
      # Si esto falla, el job se detiene y el código nuevo NUNCA llega a
      # producción: queda servida la versión anterior, que sí corresponde al
      # esquema vigente. Es la mitad segura del fallo.
      #
      # El caso inverso (migración aplicada + deploy fallido) deja esquema
      # nuevo con código viejo. Es tolerable porque las migraciones de este
      # repo son aditivas: el código viejo ignora las tablas y columnas que no
      # conoce. Una migración destructiva (drop/rename de algo en uso) rompería
      # esa premisa — esas hay que partirlas en dos despliegues.
      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migraciones a producción
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          # Sin --include-all: solo migraciones posteriores a la última remota.
          # Una migración que quede fuera de orden (aplicada a mano antes de
          # tiempo) hay que resolverla con `supabase migration repair`, no
          # aflojando este comando.
          supabase db push --yes

      # ── Fase 2: código ───────────────────────────────────────────────────
      - name: Instalar Vercel CLI
        # Versión fija: `vercel@latest` puede cambiar de comportamiento sin aviso.
        run: npm install -g vercel@59

      - name: Traer configuración de producción
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build de producción
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Desplegar a producción
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado: $url"

      # Comprobación mínima de que lo desplegado responde. No sustituye a la
      # suite E2E (que ya corrió contra el stack efímero del job `test`);
      # atrapa el caso de un deploy que arranca roto en el entorno real.
      - name: Verificar que producción responde
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 \
                   --retry-all-errors "${{ steps.deploy.outputs.url }}")
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "La home no responde 200 tras el despliegue"; exit 1; }
